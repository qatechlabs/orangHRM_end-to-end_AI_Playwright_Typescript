name: E2E

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 2 * * 1-5' # nightly regression, Mon-Fri 02:00 UTC
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        options: [demo, qa, staging]
        default: demo
      browsers:
        description: Comma separated browsers
        default: chromium
      grep:
        description: Optional --grep filter (e.g. @smoke or PIM-)
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ inputs.env || 'demo' }}
  BROWSERS: ${{ inputs.browsers || 'chromium' }}
  ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  RUN_ID: ${{ github.run_id }}

jobs:
  static:
    name: Lint, types, test-case gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run tc:validate

  test:
    name: Tests (shard ${{ matrix.shard }}/4)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps $(echo "$BROWSERS" | tr ',' ' ')
      - name: Run tests
        run: npx playwright test --project='ui-*' --project=api --shard=${{ matrix.shard }}/4 ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-results-${{ matrix.shard }}
          path: evidence-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  # Specs that change the demo's GLOBAL configuration (PIM optional fields, custom fields) would break
  # tests on other shards while they run, so they get their own job: after the shards, one worker.
  global-config:
    name: Global-configuration specs
    needs: [static, test]
    if: ${{ !cancelled() && needs.static.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps $(echo "$BROWSERS" | cut -d, -f1)
      - name: Run global-config tests
        run: npx playwright test --project=global-config ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-global-config
          path: allure-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-results-global-config
          path: evidence-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-global-config
          path: test-results
          retention-days: 7

  report:
    name: Allure report
    needs: [test, global-config]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Restore report history
        uses: actions/cache/restore@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: allure-history-${{ github.ref_name }}-
      - run: npm run report:allure
      - uses: actions/download-artifact@v4
        with:
          pattern: evidence-results-*
          path: evidence-results
          merge-multiple: true
      - name: Word report (execution log + screenshot evidence)
        run: npm run report:word
      - uses: actions/upload-artifact@v4
        with:
          name: word-report
          path: evidence-report
          retention-days: 30
      - name: Save report history
        uses: actions/cache/save@v4
        with:
          path: allure-report/history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
